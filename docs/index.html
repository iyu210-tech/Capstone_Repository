<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB HL Visualisations</title>
<meta name="description" content="Runnable Python visualisations for hard IB Higher Level topics in Maths, Physics and Chemistry.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-head">
  <a class="brand" href="#/">
    <span class="brand-mark">∫</span>
    <span>
      <strong>IB HL Visualisations</strong>
      <small>Hard topics, made runnable</small>
    </span>
  </a>
  <a class="ghost-btn" href="https://github.com/iyu210-tech/Capstone_Repository" target="_blank" rel="noopener">GitHub ↗</a>
</header>

<main id="view"></main>

<footer class="site-foot">
  <p>Capstone project by Ian Yu — Maths AA HL, Physics HL, Chemistry HL.
     Every animation here is a browser port of the Python in the same folder.</p>
</footer>

<!-- templates ------------------------------------------------------------ -->
<template id="tpl-home">
  <section class="hero">
    <h1>Hard IB topics you can <em>run</em>.</h1>
    <p>Each topic is a small, self-contained Python program that makes one
       difficult idea visible. Play with it here in the browser, then download
       the code and change the numbers yourself.</p>
  </section>

  <section class="controls">
    <input id="search" type="search" placeholder="Search topics, e.g. &ldquo;why does heating speed up a reaction&rdquo;" autocomplete="off">
    <div id="filters" class="filters"></div>
  </section>

  <section id="cards" class="cards"></section>
  <p id="empty" class="empty" hidden>No topic matches that yet — the collection grows each week.</p>
</template>

<template id="tpl-topic">
  <a class="back" href="#/">← All topics</a>
  <article class="topic">
    <header class="topic-head">
      <span class="pill" data-subject></span>
      <h1 data-title></h1>
      <p class="syllabus" data-syllabus></p>
    </header>

    <section class="panel">
      <h2>Try it</h2>
      <div class="demo">
        <canvas id="stage" width="900" height="480"></canvas>
        <div id="demo-controls" class="demo-controls"></div>
        <p id="demo-readout" class="readout"></p>
      </div>
    </section>

    <section class="two-up">
      <div class="panel">
        <h2>The hard bit</h2>
        <p data-hard></p>
      </div>
      <div class="panel">
        <h2>What this shows</h2>
        <p data-shows></p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>The Python</h2>
        <div class="actions">
          <button id="copy-btn" class="btn">Copy</button>
          <button id="dl-btn" class="btn primary">Download .py</button>
        </div>
      </div>
      <p class="hint">This is the real file from the repository, not a
         simplified version. Run it with
         <code>pip install -r requirements.txt</code> and you get the same
         figures as the animation above.</p>
      <pre class="code"><code id="source"></code></pre>
      <p class="hint">
        Prefer a notebook? <a data-notebook target="_blank" rel="noopener">View on GitHub</a>
        · <a data-colab target="_blank" rel="noopener">Open in Colab</a>
        (runs in the browser, nothing to install).
      </p>
    </section>
  </article>
</template>

<script src="topics.js"></script>
<script src="demos.js"></script>
<script src="app.js"></script>
</body>
</html>
