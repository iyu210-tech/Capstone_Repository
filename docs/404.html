<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &mdash; IB HL Visualisations</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4341f'/%3E%3Ctext x='16' y='24' font-size='23' font-family='Georgia,serif' fill='%23fff' text-anchor='middle'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
<!-- A 404 can be served for any URL depth, so relative paths would resolve
     against the wrong folder, and "/" is wrong on GitHub Pages, where the
     site lives under /Capstone_Repository/. This works out the site root
     before the stylesheet is requested. Vercel and Render serve at "/". -->
<script>
  (function () {
    var m = location.pathname.match(/^\/Capstone_Repository\//i);
    var base = document.createElement("base");
    base.href = m ? m[0] : "/";
    document.head.appendChild(base);
  })();
</script>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body data-page="missing">

<header class="site-head">
  <div class="site-head-inner">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">&#8747;</span>
      <span class="brand-text">
        <strong>IB HL Visualisations</strong>
        <small>Ian Yu&rsquo;s lab notebook</small>
      </span>
    </a>
    <div class="theme-toggle" role="group" aria-label="Colour theme" style="margin-left:auto">
      <button type="button" data-theme-choice="light" aria-pressed="false" title="Light">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <span class="sr-only">Light</span>
      </button>
      <button type="button" data-theme-choice="system" aria-pressed="true" title="Match the system">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" class="fill"/></svg>
        <span class="sr-only">System</span>
      </button>
      <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>
        <span class="sr-only">Dark</span>
      </button>
    </div>
  </div>
</header>

<main id="view">
  <!-- Served by Vercel automatically, and by server.py's send_error, so a bad
       link looks the same on both hosts. Deliberately static: no topics.js,
       no app.js - the router never runs, because the point of this page is
       that the URL never reached it. -->
  <section class="notfound">
    <p class="eyebrow">Error 404 &middot; no such page</p>
    <h1>That page is not here</h1>
    <p>The link may be out of date, or the topic may have been renamed since it
       was shared &mdash; the collection grows each week.</p>
    <p><a class="btn primary" href="./">Browse all topics &#8594;</a></p>
  </section>
</main>

<footer class="site-foot">
  <div class="site-foot-inner">
    <p class="foot-sign"><span class="brand-mark small" aria-hidden="true">&#8747;</span>
       A capstone by Ian Yu &mdash; Maths AA HL, Physics HL, Chemistry HL.</p>
  </div>
</footer>

</body>
</html>
