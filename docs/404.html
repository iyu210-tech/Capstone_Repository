<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &mdash; SlimeIB</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="stylesheet" href="/style.css">
<script>
  document.documentElement.dataset.theme =
    window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
</script>
</head>
<body>

<header class="site-head">
  <div class="head-inner">
    <a class="brand" href="/" aria-label="SlimeIB home">
      <img class="brand-mark" src="/logo.png" alt="" width="36" height="36">
      <span class="brand-text">
        <strong>Slime<span>IB</span></strong>
      </span>
    </a>
  </div>
</header>

<main id="view">
  <!-- Served by Vercel automatically, and by server.py's send_error, so a bad
       link looks the same on both hosts. Deliberately static: no app.js - the
       router never runs, because the point of this page is that the URL never
       reached it. -->
  <section class="notfound">
    <h1>That page is not here</h1>
    <p>The link may be out of date, or the page may have been renamed since it
       was shared.</p>
    <p><a href="/">Go to the home page &#8594;</a></p>
  </section>
</main>

<footer class="site-foot">
  <p>SlimeIB, a project by Ian Yu. Not affiliated with the International Baccalaureate.</p>
</footer>

</body>
</html>
